name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: PaoBu-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish to Release "latest"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PaoBu.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest PaoBu.apk --prerelease \
            --title "PaoBu 最新版 #${{ github.run_number }}" \
            --notes "自动构建：${{ github.sha }}。手机上直接下载 PaoBu.apk 覆盖安装即可。"
